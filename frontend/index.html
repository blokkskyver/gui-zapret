<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZAPRET</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><script src="theme.js"></script><link rel="stylesheet" href="style.css"></head><body>
<header><span class="grip"></span><strong>ZAPRET</strong><small id="appVersion">0.1.1</small><button id="repository">Flowseal ↗</button><span class="grip"></span><button id="theme" title="Включить тёмную тему" aria-label="Включить тёмную тему">☾</button><button id="minimize" aria-label="Свернуть">−</button><button id="close" aria-label="Закрыть">×</button></header>
